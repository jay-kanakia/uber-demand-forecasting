stages:
  data_ingestion:
    cmd: python ./src/data/data_ingestion.py
    deps:
    - ./src/data/data_ingestion.py
  feature_engineering:
    cmd: python ./src/features/feature_engineering.py
    deps:
    - ./src/features/feature_engineering.py
    params:
    - feature_engineering.ewma.alpha
    - feature_engineering.mini_batch_kmeans.n_clusters
    - feature_engineering.mini_batch_kmeans.n_init
    - feature_engineering.mini_batch_kmeans.random_state
    outs:
    - ./data/processed/resampled_data.csv
    - ./models/mini_batch_kmeans.joblib
    - ./models/scaler.joblib
  feature_preprocessing:
    cmd: python ./src/features/feature_preprocessing.py
    deps:
    - ./data/processed/resampled_data.csv
    - ./src/features/feature_preprocessing.py
    outs:
    - ./data/processed/test_df.csv
    - ./data/processed/train_df.csv
  model_training:
    cmd: python ./src/models/model_training.py
    deps:
    - ./data/processed/train_df.csv
    - ./src/models/model_training.py
    outs:
    - ./models/encoder.joblib
    - ./models/model.joblib
